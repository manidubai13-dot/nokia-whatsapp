<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240,initial-scale=1">
<title>Nokia WhatsApp Web</title>

<style>
body{
margin:0;
background:#101010;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
padding:10px;
}

.phone{
width:240px;
background:#000;
border:4px solid #444;
border-radius:12px;
overflow:hidden;
color:white;
}

.status{
background:#202020;
padding:4px 8px;
font-size:12px;
display:flex;
justify-content:space-between;
}

.header{
background:#075e54;
padding:8px;
text-align:center;
font-weight:bold;
}

.contacts{
height:180px;
overflow:auto;
background:#111;
}

.contact{
padding:8px;
border-bottom:1px solid #222;
}

.contact.active{
background:#128c7e;
}

.chat{
height:120px;
padding:8px;
background:#0b141a;
font-size:12px;
overflow:auto;
}

.msg{
margin:5px 0;
padding:5px;
background:#202c33;
border-radius:6px;
}

.input{
background:#222;
padding:8px;
text-align:center;
font-size:12px;
}

.keypad{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px;
padding:4px;
background:#111;
}

.key{
background:#333;
padding:10px 0;
text-align:center;
border-radius:4px;
font-size:12px;
}

.softkeys{
display:flex;
justify-content:space-between;
padding:5px;
background:#222;
font-size:12px;
}
</style>
</head>

<body>

<div class="phone">

<div class="status">
<span>21:34</span>
<span>4G ███</span>
</div>

<div class="header">
WhatsApp
</div>

<div class="contacts">
<div class="contact active">Manikandan</div>
<div class="contact">Tabreed Team</div>
<div class="contact">Maintenance</div>
<div class="contact">Family</div>
<div class="contact">Friends</div>
</div>

<div class="chat">
<div class="msg">Hello from Nokia HMD TA-1654</div>
<div class="msg">WhatsApp keypad view</div>
<div class="msg">Optimized for 240x320 screen</div>
</div>

<div class="input">
ABC Input Mode
</div>

<div class="keypad">
<div class="key">1</div>
<div class="key">2 ABC</div>
<div class="key">3 DEF</div>
<div class="key">4 GHI</div>
<div class="key">5 JKL</div>
<div class="key">6 MNO</div>
<div class="key">7 PQRS</div>
<div class="key">8 TUV</div>
<div class="key">9 WXYZ</div>
<div class="key">*</div>
<div class="key">0</div>
<div class="key">#</div>
</div>

<div class="softkeys">
<span>Menu</span>
<span>Select</span>
</div>

</div>

</body>
</html>
